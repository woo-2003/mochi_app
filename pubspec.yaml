name: mochi_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Firebase 연동을 위한 핵심 패키지들
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  google_sign_in: ^6.2.1
  # Firebase 핵심 DB인 Firestore 패키지
  cloud_firestore: ^5.1.0
  # 연락처 접근 및 권한 요청을 위한 패키지 (최신 유지보수 패키지로 교체)
  flutter_contacts: ^1.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
