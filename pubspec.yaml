name: mochi_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Firebase 연동을 위한 핵심 패키지들
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  google_sign_in: ^6.2.1
  # 카카오 로그인을 위한 SDK
  kakao_flutter_sdk_user: ^1.9.0
  # Firebase 핵심 DB인 Firestore 패키지
  cloud_firestore: ^5.1.0
  # 연락처 접근 및 권한 요청을 위한 패키지 (최신 유지보수 패키지로 교체)
  flutter_contacts: ^1.1.8
  # Google Maps 위젯을 위한 핵심 패키지
  google_maps_flutter: ^2.6.1
  # 실시간 GPS 위치 추적을 위한 패키지
  location: ^6.0.2
  # AI 상태 추론을 위한 Gemini 패키지
  google_generative_ai: ^0.4.4
  # 날짜 및 시간 포맷팅을 위한 패키지
  intl: ^0.20.2
  # 푸시 알림 처리를 위한 FCM 패키지
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
